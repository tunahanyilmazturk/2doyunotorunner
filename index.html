<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Runner RPG</title>
    <link rel="preload" href="assets/fonts/pixelify-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/panels.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/features.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">⚔️ <span>Idle Runner</span> RPG</div>
        <div class="currencies">
          <div class="currency gold" title="Altın">
            <span class="ico">🪙</span>
            <span id="hud-gold">0</span>
            <small id="hud-gps">0/sn</small>
          </div>
          <div class="currency souls" title="Ruh (Yeniden Doğuş)">
            <span class="ico">👻</span>
            <span id="hud-souls">0</span>
          </div>
          <div class="currency gems" title="Elmas (özel eşyalar, iksir/rün paketleri ve sınıflar)">
            <span class="ico">💎</span>
            <span id="hud-gems">0</span>
          </div>
        </div>
        <div class="topbar-right">
          <span id="save-indicator" class="save-indicator">💾 Kaydedildi</span>
          <button id="pause-btn" class="icon-btn" title="Duraklat / Devam et (P)" aria-label="Duraklat"></button>
          <div class="speed-controls" id="speed-controls" title="Oyun hızı"></div>
          <button id="dock-toggle" class="dock-toggle" title="Alt menüyü gizle / göster (M)"></button>
          <button id="settings-btn" class="icon-btn" title="Ayarlar ve İstatistikler (Esc)">⚙️</button>
        </div>
      </header>

      <section class="stage">
        <canvas id="game-canvas"></canvas>
        <div class="hud">
          <div class="hud-left">
            <div class="hp-frame" title="Can">
              <span class="hp-heart" aria-hidden="true">♥</span>
              <div class="bar hp-bar">
                <div class="fill" id="hud-hp-fill"></div>
                <span id="hud-hp-text"></span>
              </div>
              <button id="hud-stats-btn" class="hp-stats-btn" title="Karakter statları" aria-label="Karakter statları">📊</button>
              <button id="hud-goals-btn" class="hp-stats-btn hud-goals-btn" title="Görevler ve ödüller" aria-label="Görevler ve ödüller">🎯<span id="hud-goals-badge" class="hud-badge" hidden></span></button>
            </div>
            <div class="buff-list" id="buff-list"></div>
          </div>
          <div class="stage-plaque">
            <div class="hud-biome" id="hud-biome"></div>
            <div class="hud-stage" id="hud-stage">Bölge 1</div>
            <div class="kill-pips" id="kill-pips" title="Bu bölgedeki öldürmeler"></div>
            <div class="hud-status" id="hud-status"></div>
            <div class="bar boss-bar" id="boss-timer" hidden>
              <div class="fill"></div>
              <span></span>
            </div>
          </div>
          <div class="hud-right">
            <div class="hud-dps" id="hud-dps"></div>
            <button id="boss-btn" class="boss-btn" hidden title="Kısayol: B">⚔ Boss'a meydan oku</button>
            <button id="tower-exit" class="boss-btn tower-exit" hidden title="Ana koşuya dön">🚪 Kuleden çık</button>
            <button id="prestige-pill" class="prestige-pill" hidden title="İlerleme durdu: yeniden doğup Ruh Ağacı'nı güçlendir"></button>
            <ul class="loot-feed" id="loot-feed" aria-label="Son ganimetler"></ul>
          </div>
        </div>
        <div class="action-bar" id="action-bar"></div>
        <div class="pause-overlay" id="pause-overlay" hidden>
          <div class="pause-card">
            <div class="pause-icon">⏸</div>
            <div class="pause-title">Duraklatıldı</div>
            <div class="pause-hint">Devam etmek için <b>P</b> tuşuna bas veya aşağıdaki düğmeye dokun</div>
            <button id="pause-resume" class="btn btn-primary">▶ Devam Et</button>
          </div>
        </div>
      </section>

      <main class="dock">
        <nav class="nav-rail" id="nav-rail"></nav>
        <section class="dock-content" id="tab-content"></section>
      </main>
    </div>

    <div id="tooltip" class="tooltip" hidden></div>
    <div id="toasts" class="toasts"></div>
    <div id="modal-root"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
